name: Database Migration Runner

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Single file to run. Leave blank to run ALL.'
        required: false
        default: ''
  schedule:
    # Runs every 5 minutes — picks up any pending migration pushed since last run
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*.sql'
      - 'supabase/migrations/**'

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnose connectivity
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes (hidden)}"
          echo "Runner IP: $(curl -sf https://api.ipify.org || echo unknown)"
          echo "Mgmt API: $(curl -sf -o /dev/null -w '%{http_code}' https://api.supabase.com/v1/projects -H 'Authorization: Bearer test' || echo failed)"

      - name: Install Supabase JS
        run: npm install @supabase/supabase-js --no-save

      - name: Run migrations
        id: migrate
        env:
          SUPABASE_URL:              ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_FILE:            ${{ github.event.inputs.migration_file }}
        run: node .github/scripts/run-migration-ci.mjs

      - name: Commit status back to branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add supabase/migration-status.json
          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "ci: migration status $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin HEAD:main
          fi
