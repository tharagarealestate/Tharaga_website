name: Run Supabase Migrations

# Fresh workflow — auto-enabled on push to default branch.
# Triggers on: SQL file changes, this workflow file, or every 5 minutes (schedule).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*.sql'
      - 'supabase/migrations/**'
      - '.github/workflows/run-migrations.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Single file (e.g. 085_production_readiness_comprehensive_fix.sql). Blank = ALL.'
        required: false
        default: ''

jobs:
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write started marker
        run: |
          node -e "
            const fs = require('fs');
            const f = 'supabase/migration-status.json';
            const prev = JSON.parse(fs.readFileSync(f, 'utf8'));
            fs.writeFileSync(f, JSON.stringify({
              ...prev,
              workflow_started_at: new Date().toISOString(),
              run_id: process.env.GITHUB_RUN_ID,
              branch: process.env.GITHUB_REF_NAME,
              success: null,
              error: null,
            }, null, 2) + '\n');
          "
        env:
          GITHUB_RUN_ID:   ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Diagnose secrets
        env:
          SUPABASE_URL:           ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          HAS_ACCESS_TOKEN:       ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes (hidden)}"
          echo "SUPABASE_ACCESS_TOKEN set: $HAS_ACCESS_TOKEN"
          echo "SUPABASE_SERVICE_ROLE_KEY set: $HAS_SERVICE_ROLE_KEY"
          echo "Runner IP: $(curl -sf https://api.ipify.org || echo unknown)"

      - name: Install deps
        run: npm install @supabase/supabase-js --no-save

      - name: Run migrations
        env:
          SUPABASE_URL:              ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_FILE:            ${{ github.event.inputs.migration_file }}
        run: node .github/scripts/run-migration-ci.mjs

      - name: Write failure marker (if runner did not write status)
        if: failure()
        run: |
          node -e "
            const fs = require('fs');
            const f = 'supabase/migration-status.json';
            const prev = JSON.parse(fs.readFileSync(f, 'utf8'));
            if (!prev.ran_at) {
              fs.writeFileSync(f, JSON.stringify({
                ...prev,
                ran_at: new Date().toISOString(),
                success: false,
                error: 'Migration runner did not complete — check GitHub Actions logs for run_id: ' + (prev.run_id || 'unknown'),
              }, null, 2) + '\n');
            }
          "

      - name: Commit status back to main
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add supabase/migration-status.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "ci: migration status $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin HEAD:main
          fi
